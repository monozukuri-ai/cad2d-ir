[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cad2d-ir-native"
# The same version as cad2d-ir, which pins this package and is released
# together with it (scripts/check_release.py keeps the versions in step).
version = "0.18.0"
description = "The native code (Rust) of cad2d-ir: typed IR, DXF writer and JWW entity conversion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["cad", "dxf", "jww", "2d", "intermediate-representation", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
# No dependencies: this is the native half of cad2d-ir, installed as its
# dependency. The DXF writer calls back into cad2d_ir (code pages, MTEXT, fonts).
dependencies = []

[project.urls]
Homepage = "https://github.com/monozukuri-ai/cad2d-ir"
Repository = "https://github.com/monozukuri-ai/cad2d-ir"
Documentation = "https://github.com/monozukuri-ai/cad2d-ir/tree/main/native"
Issues = "https://github.com/monozukuri-ai/cad2d-ir/issues"

[tool.maturin]
python-source = "python"
module-name = "cad2d_ir_native._core"
features = ["pyo3/extension-module"]

[tool.uv]
# What a build of this directory depends on, for uv: a checkout of cad2d-ir
# installs it from here, and it is built again when the Rust code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "python/**/*.py" },
]
