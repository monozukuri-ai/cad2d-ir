[workspace]
members = ["crates/cad2d-ir-core", "crates/cad2d-ir-jww", "crates/cad2d-ir-py", "."]
resolver = "2"

[workspace.package]
# Generated from ../pyproject.toml by scripts/set_version.py; do not edit here.
version = "0.18.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/monozukuri-ai/cad2d-ir"

[workspace.dependencies]
# The JWW reader, from a released tag: a build needs no checkout of ezjww next
# to this repository. `ezjww` on PyPI of the same version or a later one reads
# the header in cad2d_ir/importers/jww.py (the floor of the `jww` extra in
# ../pyproject.toml follows this tag).
ezjww-core = { git = "https://github.com/monozukuri-ai/ezjww", tag = "v0.7.13" }

[package]
name = "cad2d-ir-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The native code (Rust) of cad2d-ir: typed IR, DXF writer and JWW entity conversion"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cad2d-ir-py = { path = "crates/cad2d-ir-py" }
pyo3 = { version = "0.22.4", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
