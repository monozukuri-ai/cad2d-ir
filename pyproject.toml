[project]
name = "cad2d-ir"
# The release version: use scripts/set_version.py to update it and derived files.
version = "0.18.1"
description = "Intermediate representation (IR) and importers for 2D CAD formats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["cad", "dxf", "dwg", "dgn", "dwf", "edrw", "edrawings", "exb", "caxa", "icd", "icad", "idw", "inventor", "jww", "jws", "mi", "pdf", "sxf", "geometry", "2d", "intermediate-representation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # The DXF writer and the entity conversion of the JWW importer are native
    # code: the Rust extension under native/, released with this package under
    # the same version (scripts/set_version.py generates this pin).
    "cad2d-ir-native==0.18.1",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dwg = ["ezdwg>=0.11,<1"]
dgn = ["ezdgn>=0.3,<0.4"]
dwf = ["ezdwf>=0.0.11,<0.1"]
# edrawings-kit ships wheels for Linux x86_64, Windows and macOS arm64 only; like
# icadkit it stays out of `all` so that `cad2d-ir[all]` installs on Linux aarch64.
edrawings = ["edrawings-kit>=0.2,<0.3"]
exb = ["ezexb>=0.3.3,<0.4"]
hpgl = ["ezhpgl>=0.1.0a2,<0.2"]
# icadkit ships wheels for Linux x86_64, Windows and macOS arm64 only; it is kept
# out of `all` so that `cad2d-ir[all]` still installs on Linux aarch64.
icad = ["icadkit>=0.3.12,<0.4"]
# inventor-kit needs Python 3.11+ and has its own licence terms (see README), so
# it is deliberately not part of `all`. Since 0.10 it installs no geometry kernel
# unless one of its own extras is requested; the IDW path needs none.
idw = ["inventor-kit>=0.11,<0.12; python_version >= '3.11'"]
# The reader the native code is built with (`ezjww-core` in native/Cargo.toml), or
# a later one: the header of a file is read by this package, its entities by the
# native code.
jww = ["ezjww>=0.7.13,<0.8"]
mi = ["ezmi2d>=0.2,<0.3"]
pdf = ["pypdfium2>=4.30,<6"]
sxf = ["ezsxf>=0.2,<0.4"]
all = ["ezhpgl>=0.1.0a2,<0.2", "ezdwg>=0.11,<1", "ezdgn>=0.3,<0.4", "ezdwf>=0.0.11,<0.1", "ezexb>=0.3.3,<0.4", "ezjww>=0.7.13,<0.8", "ezmi2d>=0.2,<0.3", "pypdfium2>=4.30,<6", "ezsxf>=0.2,<0.4"]

[project.urls]
Homepage = "https://github.com/neka-nat/cad2d-ir"
Repository = "https://github.com/neka-nat/cad2d-ir"
Documentation = "https://github.com/neka-nat/cad2d-ir/tree/main/docs"
Issues = "https://github.com/neka-nat/cad2d-ir/issues"

[project.scripts]
cad2d-ir = "cad2d_ir.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "packaging>=26.3",
    "pytest>=8.4.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv.sources]
# In a checkout the native code is built from native/ (a Rust toolchain is
# needed); an installation from PyPI takes the wheel of the same version.
cad2d-ir-native = { path = "native" }

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
# native/tests: the native code through its own interface, the DXF the writer
# makes of the documents under native/tests/golden, and the tables it carries.
testpaths = ["tests", "native/tests"]
