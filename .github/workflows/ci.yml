name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev --all-extras

      - name: Run tests
        run: uv run --no-sync pytest -q

  # The Rust extension under native/ (the package cad2d-ir-native): built from
  # source on every kind of platform a release has a wheel for, and compared
  # with the Python implementation by native/tests.
  native:
    name: native / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python the abi3 wheel supports, with the Rust checks
          - os: ubuntu-latest
            python-version: "3.10"
            rust-checks: true
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check release versions
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tomli>=2.0; python_version < '3.11'"
          python scripts/check_release.py
          echo "EZJWW_TAG=$(python scripts/check_release.py --ezjww-tag)" >> "${GITHUB_ENV}"

      # The sample drawings of the reader the Rust code is built with: the
      # JWW tests compare the native import with the Python one on real files.
      - name: Checkout JWW samples
        uses: actions/checkout@v4
        with:
          repository: monozukuri-ai/ezjww
          ref: ${{ env.EZJWW_TAG }}
          path: .ezjww
          sparse-checkout: jww_samples

      - name: Rust checks
        if: matrix.rust-checks
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p cad2d-ir-core -p cad2d-ir-jww --locked

      - name: Build and install
        shell: bash
        run: |
          python -m pip install -e ".[jww]" pytest
          python -m pip install ./native
          python -m pip check

      - name: Native tests
        shell: bash
        env:
          EZJWW_SAMPLES: ${{ github.workspace }}/.ezjww/jww_samples
        run: python -m pytest native/tests -q -rs
